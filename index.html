/* ===== NETCHI PREMIUM UI OVERHAUL ===== */
:root{
  --bg:#050607;
  --surface:#0b0e10;
  --surface2:#0f1315;
  --surface3:#14191b;
  --line:rgba(255,255,255,.085);
  --text:#f7f8f8;
  --muted:#8b9597;
  --soft:#cbd1d2;
  --accent:#a78bfa;
  --accent2:#765df5;
  --accent3:#c8bdff;
  --gold:#f6ca78;
  --radius:24px;
  --shadow:0 22px 70px rgba(0,0,0,.42);
}

/* atmospheric background */
html,body{background:#050607}
body{
  overflow-x:hidden;
  background:
    radial-gradient(700px 360px at 100% -8%,rgba(118,93,245,.16),transparent 65%),
    radial-gradient(560px 340px at -15% 34%,rgba(167,139,250,.075),transparent 68%),
    radial-gradient(520px 300px at 50% 100%,rgba(70,55,160,.06),transparent 70%),
    var(--bg);
}
body:after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.28;
  background-image:radial-gradient(rgba(255,255,255,.11) .55px,transparent .55px);
  background-size:22px 22px;
  mask-image:linear-gradient(to bottom,black,transparent 80%);
}

/* app / top bar */
.app{width:min(780px,100%);padding-bottom:112px}
.top{
  padding:13px 15px 12px;
  background:linear-gradient(180deg,rgba(5,6,7,.98) 0%,rgba(5,6,7,.9) 68%,transparent 100%);
  border-bottom:1px solid rgba(255,255,255,.045);
  backdrop-filter:blur(24px) saturate(145%);
}
.brand-left{gap:12px}
.brand-mark{
  width:44px;height:44px;border-radius:15px;
  background:
    radial-gradient(circle at 30% 20%,rgba(255,255,255,.22),transparent 28%),
    linear-gradient(145deg,#7460ec,#292052 55%,#12101d);
  border:1px solid rgba(201,191,255,.2);
  box-shadow:0 12px 36px rgba(95,76,214,.3),inset 0 1px rgba(255,255,255,.13);
}
.brand-mark .icon{filter:drop-shadow(0 0 9px rgba(202,190,255,.85))}
.brand h1{font-size:17px;letter-spacing:-.35px}
.hello{font-size:10px;opacity:.9}
.balance-chip{
  padding:8px 10px;
  background:rgba(255,255,255,.045);
  border-color:rgba(255,255,255,.09);
  box-shadow:inset 0 1px rgba(255,255,255,.05);
}
.admin-gear{
  width:35px;height:35px;
  transition:.2s;
}
.admin-gear:hover{border-color:rgba(167,139,250,.28);color:var(--accent3);transform:rotate(12deg)}

/* hero */
.screen{padding:0 14px}
.hero{
  padding:24px 3px 10px;
  animation:fadeUp .45s ease both;
}
.hero-grid{gap:18px}
.eyebrow{
  color:var(--accent3);
  letter-spacing:.2px;
  text-shadow:0 0 20px rgba(167,139,250,.25);
}
.hero h2{
  font-size:32px;
  line-height:1.24;
  letter-spacing:-1px;
  margin-bottom:9px;
  background:linear-gradient(105deg,#fff 12%,#e7e1ff 55%,#a99aff 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.subtitle{font-size:12px;line-height:2.05;max-width:510px}
.hero-art{
  width:92px;height:92px;border-radius:29px;
  background:
    radial-gradient(circle at 30% 20%,rgba(255,255,255,.12),transparent 27%),
    linear-gradient(145deg,rgba(116,96,236,.22),rgba(24,20,43,.82));
  border:1px solid rgba(190,180,255,.16);
  box-shadow:0 24px 55px rgba(45,34,112,.28),inset 0 1px rgba(255,255,255,.09);
}
.hero-art:before{
  content:"";position:absolute;width:145px;height:145px;border-radius:50%;
  border:1px solid rgba(167,139,250,.08);transform:rotate(24deg);
}
.hero-art:after{background:rgba(167,139,250,.17);filter:blur(26px)}
.icon.xl{filter:drop-shadow(0 0 12px rgba(184,171,255,.42))}

/* progress */
.progress{gap:6px;margin:17px 0 10px}
.progress i{
  height:4px;background:rgba(255,255,255,.07);
  transition:.35s;border-radius:99px;
}
.progress i.active{
  background:linear-gradient(90deg,#7359ed,#b6a8ff);
  box-shadow:0 0 15px rgba(137,112,247,.55);
}

/* section headers */
.section-head{margin:27px 2px 12px}
.section-title{font-size:16px}
.section-more{font-size:10px;color:#737d7f}

/* cards */
.card,.plan{
  position:relative;
  border-radius:22px;
  background:
    linear-gradient(145deg,rgba(24,28,30,.94),rgba(10,12,14,.97));
  border:1px solid rgba(255,255,255,.075);
  box-shadow:0 12px 38px rgba(0,0,0,.22),inset 0 1px rgba(255,255,255,.035);
  overflow:hidden;
  transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease;
}
.card:before,.plan:before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(120deg,rgba(255,255,255,.045),transparent 25%,transparent 72%,rgba(167,139,250,.025));
}
.card:hover,.plan:hover{
  border-color:rgba(167,139,250,.2);
  box-shadow:0 18px 45px rgba(0,0,0,.3),0 0 0 1px rgba(167,139,250,.025);
}
.category{min-height:82px}
.category-icon,.service-icon,.payment-icon{
  width:51px;height:51px;flex-basis:51px;border-radius:17px;
  background:
    radial-gradient(circle at 30% 20%,rgba(255,255,255,.09),transparent 28%),
    linear-gradient(145deg,#282150,#11111b);
  border-color:rgba(179,167,255,.12);
  box-shadow:inset 0 1px rgba(255,255,255,.08),0 10px 25px rgba(38,28,91,.18);
}
.category-body b{font-size:14px}
.category-body span{font-size:10px}
.chevron{font-size:23px;color:#596164;transition:.2s}
.card:hover .chevron{color:#a99bff;transform:translateX(-3px)}

/* service cards */
.service{min-height:88px}
.service h3{font-size:13px}
.service p{font-size:10px;line-height:1.9}
.service-price strong{font-size:13px;text-shadow:0 0 16px rgba(167,139,250,.25)}

/* pills / plans */
.pill{
  background:rgba(255,255,255,.035);
  border-color:rgba(255,255,255,.07);
}
.plan{
  padding:17px;
  margin-bottom:10px;
}
.plan.selected{
  border-color:rgba(167,139,250,.6);
  box-shadow:0 0 0 1px rgba(167,139,250,.11),0 18px 42px rgba(55,42,145,.2),inset 0 1px rgba(255,255,255,.08);
}
.plan.selected:after{
  content:"✓";
  position:absolute;left:14px;top:14px;
  width:22px;height:22px;border-radius:50%;
  display:grid;place-items:center;
  font-size:12px;font-weight:900;color:#0d0a1d;
  background:#b9adff;box-shadow:0 0 18px rgba(167,139,250,.35);
}

/* buttons */
.btn{
  min-height:51px;
  border-radius:17px;
  background:linear-gradient(135deg,#b7aaff 0%,#846df1 48%,#6e59df 100%);
  color:#0a0815;
  letter-spacing:-.1px;
  box-shadow:0 17px 38px rgba(99,78,220,.27),inset 0 1px rgba(255,255,255,.28);
  transition:.2s;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 21px 44px rgba(99,78,220,.34)}
.btn:active{transform:translateY(1px) scale(.99)}
.btn.dark{
  background:rgba(255,255,255,.045);
  color:#e7ebeb;
  border-color:rgba(255,255,255,.08);
}
.btn.dark:hover{background:rgba(255,255,255,.065)}

/* form fields */
.field{
  background:rgba(7,10,11,.75);
  border-color:rgba(255,255,255,.075);

  transition:.2s;
}
.field::placeholder{color:#596365}

}

/* wallet */
.wallet{

    radial-gradient(260px 160px at 100% 0%,rgba(168,151,255,.17),transparent 65%),

  box-shadow:0 25px 65px rgba(47,36,117,.24),inset 0 1px rgba(255,255,255,.09);
}
.balance{font-size:29px;letter-spacing:-.7px}

/* account/support */
.account-head,.payment{min-height:66px}
.success{
  background:linear-gradient(145deg,rgba(167,139,250,.08),rgba(167,139,250,.025));
  border-color:rgba(167,139,250,.15);
}
.notice{
  background:rgba(246,202,120,.055);
  border-color:rgba(246,202,120,.12);
}

/* bottom nav */
.nav{
  width:min(780px,100%);
  height:82px;
  padding:7px 10px max(7px,env(safe-area-inset-bottom));
  background:rgba(8,10,12,.84);
  border:1px solid rgba(255,255,255,.075);
  border-bottom:0;
  border-radius:27px 27px 0 0;
  box-shadow:0 -18px 55px rgba(0,0,0,.32),inset 0 1px rgba(255,255,255,.035);
  backdrop-filter:blur(28px) saturate(160%);
}
.nav button{
  position:relative;
  color:#626b6d;
  transition:.2s;
}
.nav button.active{
  color:#b9adff;
  background:linear-gradient(180deg,rgba(167,139,250,.11),rgba(167,139,250,.045));
  box-shadow:inset 0 0 0 1px rgba(167,139,250,.1),0 8px 25px rgba(76,58,172,.12);
}
.nav button.active:before{
  content:"";position:absolute;top:3px;width:22px;height:2px;border-radius:9px;
  background:#a99aff;box-shadow:0 0 12px rgba(167,139,250,.7);
}
.nav-icon{width:21px;height:21px}
.nav-label{font-size:9px}

/* toast */
.toast{
  background:rgba(16,19,22,.96);
  border-color:rgba(167,139,250,.18);
  box-shadow:0 18px 55px rgba(0,0,0,.4);
}

/* admin */
.admin-wrap{max-width:560px;padding:20px 15px 42px}
.admin-login{
  background:linear-gradient(145deg,rgba(21,25,27,.96),rgba(10,12,14,.98));
  border-color:rgba(255,255,255,.08);
  box-shadow:var(--shadow),inset 0 1px rgba(255,255,255,.04);
}
.admin-tabs button{
  background:rgba(255,255,255,.025);
  transition:.2s;
}
.admin-tabs button.active{
  background:linear-gradient(135deg,#b7aaff,#7e68ec);
  box-shadow:0 10px 24px rgba(101,80,216,.2);
}
.stat-box,.list-row{
  background:rgba(255,255,255,.025);
  border-color:rgba(255,255,255,.07);
  box-shadow:inset 0 1px rgba(255,255,255,.025);
}
.stat-box b{letter-spacing:-.4px}

/* empty */
.empty{
  background:rgba(255,255,255,.018);
  border-color:rgba(255,255,255,.075);
}

/* subtle entrance animation */
@keyframes fadeUp{
  from{opacity:0;transform:translateY(9px)}
  to{opacity:1;transform:none}
}
.card,.plan,.summary-box,.list-row,.stat-box,.success,.notice{
  animation:fadeUp .38s ease both;
}
.card:nth-child(2){animation-delay:.025s}
.card:nth-child(3){animation-delay:.05s}
.card:nth-child(4){animation-delay:.075s}
.card:nth-child(5){animation-delay:.1s}

/* scrollbar */
*{scrollbar-width:thin;scrollbar-color:rgba(167,139,250,.3) transparent}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:rgba(167,139,250,.3);border-radius:9px}

/* mobile polish */
@media(max-width:390px){
  .hero{padding-top:20px}
  .hero h2{font-size:27px;letter-spacing:-.7px}
  .hero-art{width:78px;height:78px;border-radius:24px}
  .hero-art .icon{width:40px;height:40px}
  .card{padding:14px;border-radius:20px}
  .category-icon,.service-icon{width:47px;height:47px;flex-basis:47px}
  .nav{border-radius:23px 23px 0 0}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none!important;transition:none!important}
}


/* =========================================================
   NETCHI — SIGNATURE UI / VISUAL OVERHAUL
   Appearance-only layer: existing JS/API/flows remain intact.
   ========================================================= */

:root{
  --bg:#030406;
  --surface:#0a0d10;
  --surface2:#0d1115;
  --surface3:#12171c;
  --line:rgba(255,255,255,.085);
  --line-hi:rgba(255,255,255,.145);
  --text:#fbfbff;
  --muted:#7f8991;
  --soft:#cbd2d8;
  --accent:#9b87ff;
  --accent2:#6048e8;
  --accent3:#d9d2ff;
  --cyan:#70e6ff;
  --gold:#f7cc78;
  --danger:#ff6f82;
  --radius:25px;
  --shadow:0 30px 90px rgba(0,0,0,.52);
}

/* ---------- cinematic background ---------- */
html,body{
  background:#030406 !important;
}
body{
  position:relative;
  min-height:100vh;
  overflow-x:hidden;
  background:
    radial-gradient(700px 420px at 105% -5%,rgba(117,91,255,.22),transparent 62%),
    radial-gradient(520px 360px at -12% 38%,rgba(91,227,255,.075),transparent 65%),
    radial-gradient(620px 360px at 50% 108%,rgba(99,70,230,.10),transparent 68%),
    #030406 !important;
}
body:before{
  content:"";
  position:fixed;
  inset:-25%;
  z-index:-3;
  pointer-events:none;
  background:
    conic-gradient(from 190deg at 50% 50%,
      transparent 0 28%,
      rgba(130,108,255,.035) 35%,
      transparent 45% 68%,
      rgba(83,224,255,.025) 75%,
      transparent 82%);
  filter:blur(35px);
  animation:signatureDrift 18s ease-in-out infinite alternate;
}
body:after{
  content:"";
  position:fixed;
  inset:0;
  z-index:-2;
  pointer-events:none;
  opacity:.32;
  background-image:
    linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:42px 42px;
  mask-image:linear-gradient(to bottom,black 0%,transparent 88%);
}
@keyframes signatureDrift{
  0%{transform:translate3d(-2%,1%,0) rotate(-2deg) scale(1)}
  100%{transform:translate3d(2%,-1%,0) rotate(2deg) scale(1.04)}
}

const API_BASE='';

async function realApiCall(path,opt={}){

async function mockApi(path,opt={}){

async function init(){
 try{
  const b=await api('/api/bootstrap');state.user=b.user;state.wallet=b.wallet;state.card=b.card_number;
  state.cats=(await api('/api/categories')).categories;
  render();
 }catch(e){
  document.querySelector('#app').innerHTML=`<div class="screen" style="padding-top:60px"><div class="empty"><b style="display:block;margin-bottom:10px;color:var(--text)">مشکلی در بارگذاری پیش آمد</b><span>${esc(e.message||'لطفاً دوباره تلاش کنید')}</span><button class="btn" style="margin-top:16px" onclick="init()">${icon('arrow','icon sm')} تلاش دوباره</button></div></div>`;
 }
}
function render(){if(admin.open)return renderAdmin();syncBackBtn();if(state.tab==='account')return renderAccount();if(state.tab==='support')return renderSupport();if(state.tab==='services')return renderServices();return renderBuy()}
// ================= ADMIN PANEL (real backend) =================
function openAdmin(){admin.open=true;renderAdmin()}
function closeAdmin(){admin.open=false;admin.loggedIn=false;admin.token='';render()}
function renderAdmin(){if(!admin.loggedIn)return renderAdminLogin();loadAdminView()}
function renderAdminLogin(){
 document.querySelector('#app').innerHTML=`<div class="admin-wrap"><div class="admin-login"><h2>${icon('gear','icon sm')} ورود مدیریت</h2><div class="muted" style="font-size:11px">برای دسترسی به پنل مدیریت وارد شوید.</div>
 <input id="au" class="field" placeholder="نام کاربری" autocomplete="off">
 <input id="ap" class="field" type="password" placeholder="رمز عبور" autocomplete="off" onkeydown="if(event.key==='Enter')adminLogin()">
 <button class="btn" id="adminLoginBtn" onclick="adminLogin()">${icon('check','icon sm')} ورود</button>
 <button class="btn dark" onclick="closeAdmin()">انصراف</button>
 </div></div>`;
 setTimeout(()=>$('#au')?.focus(),50);
}
async function adminLogin(){
 const u=$('#au')?.value.trim(),p=$('#ap')?.value.trim();
 if(!u||!p)return toast('نام کاربری و رمز عبور را وارد کنید',false);
 const btn=$('#adminLoginBtn');if(btn)btn.disabled=true;
 try{
  const r=await adminApi('/api/admin/login',{method:'POST',body:{username:u,password:p}});
  admin.token=r.token;admin.loggedIn=true;admin.view='dashboard';
  toast('ورود موفق');renderAdmin();
 }catch(e){toast(e.message==='http_401'?'نام کاربری یا رمز عبور اشتباه است':e.message,false);if(btn)btn.disabled=false}
}
function setAdminView(v){admin.view=v;loadAdminView()}
async function loadAdminView(){
 const app_=$('#app');
 try{
  let body='';
  if(admin.view==='dashboard'){const d=await adminApi('/api/admin/dashboard');body=renderAdminDashboard(d)}
  else if(admin.view==='categories'){admin.cats=(await adminApi('/api/admin/categories')).categories;body=renderAdminCategories()}
  else if(admin.view==='products'){
   if(!admin.cats.length)admin.cats=(await adminApi('/api/admin/categories')).categories;
   if(admin.editCat==null&&admin.cats.length)admin.editCat=admin.cats[0].id;
   if(admin.editCat)admin.products=(await adminApi('/api/admin/products?category_id='+admin.editCat)).products;
   body=renderAdminProducts();
  }
  else if(admin.view==='orders'){admin.orders=(await adminApi('/api/admin/orders')).orders;body=renderAdminOrders()}
  else{admin.tickets=(await adminApi('/api/admin/tickets')).tickets;body=renderAdminTickets()}
  app_.innerHTML=renderAdminShell(body);
 }catch(e){
  if(e.message==='http_401'){admin.loggedIn=false;admin.token='';toast('نشست منقضی شد، دوباره وارد شوید',false);return renderAdminLogin()}
  toast(e.message,false);
 }
}
function renderAdminShell(body){
 const views={dashboard:'داشبورد',categories:'دسته‌بندی‌ها',products:'محصولات',orders:'سفارش‌ها',tickets:'تیکت‌ها'};
 return `<div class="admin-wrap">
  <div class="admin-top"><h2>${icon('gear','icon sm')} پنل مدیریت</h2><button class="icon-btn" onclick="closeAdmin()">${icon('logout','icon sm')}</button></div>
  <div class="admin-tabs">${Object.entries(views).map(([k,v])=>`<button class="${admin.view===k?'active':''}" onclick="setAdminView('${k}')">${v}</button>`).join('')}</div>
  ${body}
 </div>`;
}
function renderAdminDashboard(d){
 return `<div class="stat-grid">
  <div class="stat-box"><span>مجموع فروش</span><b>${money(d.revenue)}</b></div>
  <div class="stat-box"><span>تعداد سفارش‌ها</span><b>${d.orders}</b></div>
  <div class="stat-box"><span>سفارش‌های در انتظار</span><b>${d.pending_orders}</b></div>
  <div class="stat-box"><span>دسته‌بندی‌ها</span><b>${d.categories}</b></div>
  <div class="stat-box"><span>تیکت‌های باز</span><b>${d.open_tickets}</b></div>
 </div>`;
}
function renderAdminCategories(){
 return `<div class="card" style="margin-bottom:14px"><label style="font-size:11px;color:#b8c0c0">نام دسته‌بندی جدید<input id="newCatName" class="field" placeholder="مثلاً طراحی سایت"></label><button class="btn" onclick="adminAddCategory()">${icon('plus','icon sm')} افزودن دسته‌بندی</button></div>
 ${admin.cats.map(c=>`<div class="list-row"><div class="grow"><b>${esc(c.name)}</b><span class="sub">${c.product_count} محصول</span></div><button class="icon-btn danger" onclick="adminDeleteCategory(${c.id})">${icon('trash','icon sm')}</button></div>`).join('')||'<div class="empty">دسته‌بندی‌ای ثبت نشده.</div>'}`;
}
async function adminAddCategory(){
 const name=$('#newCatName')?.value.trim();if(!name)return toast('نام دسته‌بندی را وارد کنید',false);
 try{await adminApi('/api/admin/categories',{method:'POST',body:{name}});toast('دسته‌بندی اضافه شد');loadAdminView()}catch(e){toast(e.message,false)}
}
async function adminDeleteCategory(id){
 try{await adminApi('/api/admin/categories/'+id,{method:'DELETE'});toast('دسته‌بندی حذف شد');loadAdminView()}catch(e){toast(e.message,false)}
}
function renderAdminProducts(){
 if(!admin.cats.length)return '<div class="empty">اول یک دسته‌بندی بسازید.</div>';
 return `<div class="admin-tabs" style="margin-bottom:12px">${admin.cats.map(c=>`<button class="${admin.editCat===c.id?'active':''}" onclick="admin.editCat=${c.id};loadAdminView()">${esc(c.name)}</button>`).join('')}</div>
 <div class="card" style="margin-bottom:14px">
  <label style="font-size:11px;color:#b8c0c0">نام محصول<input id="newProdName" class="field" placeholder="مثلاً طراحی لوگو"></label>
  <label style="font-size:11px;color:#b8c0c0;display:block;margin-top:10px">قیمت (تومان، برای محصول بدون پلن)<input id="newProdPrice" class="field" type="number" placeholder="مثلاً 200000"></label>
  <label style="font-size:11px;color:#b8c0c0;display:block;margin-top:10px">توضیحات<textarea id="newProdDesc" class="field textarea" placeholder="توضیح کوتاه محصول"></textarea></label>
  <button class="btn" onclick="adminAddProduct()">${icon('plus','icon sm')} افزودن محصول</button>
 </div>
 ${admin.products.map(p=>`<div class="list-row"><div class="grow"><b>${esc(p.name)}</b><span class="sub">${p.plans.length?p.plans.length+' پلن':money(p.price)}</span></div><button class="icon-btn danger" onclick="adminDeleteProduct(${p.id})">${icon('trash','icon sm')}</button></div>`).join('')||'<div class="empty">این دسته محصولی ندارد.</div>'}`;
}
async function adminAddProduct(){
 const name=$('#newProdName')?.value.trim();
 const price=Number($('#newProdPrice')?.value||0);
 const description=$('#newProdDesc')?.value.trim()||'';
 if(!name)return toast('نام محصول را وارد کنید',false);
 try{await adminApi('/api/admin/products',{method:'POST',body:{name,price,description,category_id:admin.editCat}});toast('محصول اضافه شد');loadAdminView()}catch(e){toast(e.message,false)}
}
async function adminDeleteProduct(id){
 try{await adminApi('/api/admin/products/'+id,{method:'DELETE'});toast('محصول حذف شد');loadAdminView()}catch(e){toast(e.message,false)}
}
function renderAdminOrders(){
 const statuses=['pending_payment','payment_review','approved','in_progress','completed','cancelled'];
 return admin.orders.map(o=>`<div class="list-row"><div class="grow"><b>#${o.id} · ${esc(o.product||'—')}</b><span class="sub">${money(o.amount)} · @${esc(o.username||'-')}</span><div style="margin-top:6px"><span class="badge ${o.status}">${statusFa(o.status)}</span></div></div><select class="status-select" onchange="adminSetOrderStatus(${o.id},this.value)">${statuses.map(s=>`<option value="${s}" ${o.status===s?'selected':''}>${statusFa(s)}</option>`).join('')}</select></div>`).join('')||'<div class="empty">سفارشی ثبت نشده.</div>';
}
async function adminSetOrderStatus(id,status){
 try{await adminApi('/api/admin/orders/'+id+'/status',{method:'POST',body:{status}});toast('وضعیت سفارش بروزرسانی شد');loadAdminView()}catch(e){toast(e.message,false)}
}
function renderAdminTickets(){
 return admin.tickets.length?admin.tickets.map(t=>`<div class="list-row"><div class="grow"><b>${esc(t.subject||'بدون موضوع')} <span class="badge ${t.status==='open'?'pending_payment':'completed'}">${t.status==='open'?'باز':'بسته'}</span></b><span class="sub">@${esc(t.username||'-')} · ${t.messages.length} پیام</span></div>${t.status==='open'?`<button class="icon-btn" onclick="adminCloseTicket(${t.id})">${icon('check','icon sm')}</button>`:''}</div>`).join(''):'<div class="empty">تیکتی ثبت نشده.</div>';
}
async function adminCloseTicket(id){
 try{await adminApi('/api/admin/tickets/'+id+'/close',{method:'POST'});toast('تیکت بسته شد');loadAdminView()}catch(e){toast(e.message,false)}
}
function setTab(t){state.tab=t;state.step=1;state.product=null;state.plan=null;render()}
function renderBuy(){let body;if(state.step===1){body=hero('WE CAN FAMILY','دنیای خدمات دیجیتال','یک دسته‌بندی را انتخاب کنید و در چند مرحله سفارش خود را کامل کنید.','bag')+progress(1)+`<div class="section-head"><div class="section-title">دسته‌بندی‌ها</div><div class="section-more">${state.cats.length} دسته فعال</div></div>`+(state.cats.map(c=>`<button class="card category" onclick="pickCat(${c.id})"><div class="category-icon">${icon('grid','icon')}</div><div class="category-body"><b>${esc(c.name)}</b><span>مشاهده سرویس‌های این دسته</span></div><div class="chevron">‹</div></button>`).join('')||'<div class="empty">هنوز سرویسی به فروشگاه اضافه نشده است.</div>')}
else if(state.step===2){body=hero('مرحله دوم','انتخاب سرویس','سرویس مورد نظر خود را انتخاب کنید.','grid','go(1)')+progress(2)+(state.products.map(p=>`<button class="card service" onclick="pickProduct(${p.id})"><div class="service-icon">${icon('bolt','icon')}</div><div class="service-body"><h3>${esc(p.name)}</h3><p>${esc((p.description||'').replace(/<[^>]+>/g,'').slice(0,150))}</p></div><div class="service-price"><small>شروع از</small><strong>${money(p.plans.length?Math.min(...p.plans.map(x=>x.price)):p.price)}</strong></div></button>`).join('')||'<div class="empty">این دسته سرویس فعالی ندارد.</div>')}
else if(state.step===3)body=renderPlansBody();else if(state.step===4)body=renderPaymentBody();else body=renderReceiptBody();document.querySelector('#app').innerHTML=shell(body)}
async function pickCat(id){try{state.cat=id;state.products=(await api('/api/categories/'+id+'/products')).products;state.step=2;render()}catch(e){toast(e.message,false)}}
function pickProduct(id){state.product=state.products.find(x=>x.id===id);state.plan=state.product.plans[0]||null;state.step=state.product.plans.length?3:4;render()}
function go(n){state.step=n;render()}
function renderPlansBody(){const p=state.product;return hero('مرحله سوم','انتخاب پلن','مدت یا پلن مناسب را انتخاب کنید.','bolt','go(2)')+progress(3)+`<div class="card"><div class="eyebrow">${icon('grid','icon sm')} سرویس انتخابی</div><h3 style="margin:0 0 7px">${esc(p.name)}</h3><div class="muted" style="font-size:11px;line-height:1.9">${esc((p.description||'').replace(/<[^>]+>/g,'').slice(0,500))}</div></div>`+p.plans.map(x=>`<button class="plan ${state.plan?.id===x.id?'selected':''}" onclick="selectPlan(${x.id})"><div class="row"><b>${esc(x.label)}</b><b>${money(x.price)}</b></div>${x.duration_days?`<div class="muted" style="margin-top:7px;font-size:10px">مدت اعتبار: ${x.duration_days} روز</div>`:''}</button>`).join('')+`<button class="btn" onclick="go(4)">${icon('arrow','icon sm')} ادامه به پرداخت</button>`}
function selectPlan(id){state.plan=state.product.plans.find(x=>x.id===id);renderPlansBodyToDom()}
function renderPlansBodyToDom(){document.querySelector('#app').innerHTML=shell(renderPlansBody())}
function renderPaymentBody(){const amount=state.plan?.price||state.product.price;return hero('مرحله چهارم','نهایی‌سازی سفارش','اطلاعات سفارش را بررسی و روش پرداخت را انتخاب کنید.','card',`go(${state.product.plans.length?3:2})`)+progress(4)+`<div class="summary"><div class="summary-box"><span>سرویس</span><b>${esc(state.product.name)}</b></div><div class="summary-box"><span>مبلغ</span><b class="price">${money(amount)}</b></div></div><div class="card" style="margin-top:11px"><label style="font-size:11px;color:#b8c0c0">توضیحات سفارش<textarea id="desc" class="field textarea" placeholder="در صورت نیاز توضیحات خود را وارد کنید"></textarea></label></div><div class="section-head"><div class="section-title">روش پرداخت</div><div class="section-more">انتخاب کنید</div></div><button class="card payment" onclick="pay('wallet')"><div class="payment-icon">${icon('wallet','icon')}</div><div class="payment-body"><b>پرداخت با کیف پول</b><span>موجودی فعلی: ${money(state.wallet)}</span></div><div class="chevron">‹</div></button><button class="card payment" onclick="pay('card')"><div class="payment-icon">${icon('card','icon')}</div><div class="payment-body"><b>کارت به کارت</b><span>پس از ثبت سفارش، تصویر رسید را ارسال می‌کنید.</span></div><div class="chevron">‹</div></button>`}
async function pay(method){try{const desc=$('#desc')?.value||'';const r=await api('/api/orders',{method:'POST',body:{product_id:state.product.id,plan_id:state.plan?.id||null,description:desc,payment_method:method}});if(method==='card'){state.orderId=r.order_id;state.card=r.card_number;state.step=5;render()}else{state.wallet=(await api('/api/wallet')).balance;toast('سفارش با موفقیت ثبت شد');setTab('account')}}catch(e){toast(e.message==='insufficient_balance'?'موجودی کیف پول کافی نیست.':e.message,false)}}
function renderReceiptBody(){const amount=state.plan?.price||state.product.price;return hero('مرحله آخر','ارسال رسید پرداخت','مبلغ را به کارت زیر واریز کنید و تصویر رسید را ارسال کنید.','card')+`<div class="card"><div class="notice"><b>شماره کارت</b><div style="font-size:18px;letter-spacing:1px;margin-top:6px;color:#fff">${esc(state.card)}</div></div><div style="margin-top:15px"><div class="muted" style="font-size:10px">مبلغ قابل پرداخت</div><div class="balance" style="font-size:25px">${money(amount)}</div></div><input id="receipt" class="field" type="file" accept="image/jpeg,image/png,image/webp"><button class="btn" id="sendReceiptBtn" onclick="sendReceipt()">${icon('check','icon sm')} ارسال رسید و ثبت سفارش</button></div><button class="btn dark" onclick="setTab('buy')">بازگشت به فروشگاه</button>`}
async function sendReceipt(){
 const f=$('#receipt').files[0];if(!f)return toast('ابتدا تصویر رسید را انتخاب کنید',false);
 const btn=$('#sendReceiptBtn');btn.disabled=true;
 if(state.demo){
  await delay();
  const o=DEMO_DB.orders.find(x=>x.id===state.orderId);if(o)o.status='payment_review';
  toast('رسید (حالت دمو) ثبت شد و در انتظار بررسی است');
  setTimeout(()=>setTab('account'),500);
  return;
 }
 try{
  const fd=new FormData();fd.append('receipt',f);
  const res=await fetch(`/api/orders/${state.orderId}/receipt`,{method:'POST',headers:{'Authorization':'tma '+(initData||'')},body:fd});
  const data=await res.json().catch(()=>({}));
  if(!res.ok)throw new Error(data.error||'خطا در ارسال رسید');
  toast('رسید با موفقیت ارسال شد و در انتظار بررسی است');
  setTimeout(()=>setTab('account'),500);
 }catch(e){
  setDemoMode(true);
  const o=DEMO_DB.orders.find(x=>x.id===state.orderId);if(o)o.status='payment_review';
  toast('رسید (حالت دمو) ثبت شد و در انتظار بررسی است');
  setTimeout(()=>setTab('account'),500);
 }
}
async function renderAccount(){try{const d=await api('/api/wallet');state.wallet=d.balance;const o=await api('/api/orders');state.orders=o.orders}catch(e){toast(e.message||'خطا در دریافت اطلاعات حساب',false)}document.querySelector('#app').innerHTML=shell(hero('پروفایل شما','حساب کاربری','موجودی، سفارش‌ها و وضعیت خریدهای شما در یکجا.','user')+`<div class="card wallet"><div class="wallet-label">موجودی کیف پول</div><div class="balance">${money(state.wallet)}</div><div class="wallet-label" style="margin-top:11px">حساب: @${esc(state.user?.username||'کاربر تلگرام')}</div></div><div class="section-head"><div class="section-title">خریدهای من</div><div class="section-more">${state.orders.length} سفارش</div></div>`+(state.orders.length?state.orders.slice(0,12).map(o=>`<div class="card"><div class="row"><b style="font-size:13px">${esc(o.product)}</b><b class="price">${money(o.amount)}</b></div><div class="order-status"><span class="dot"></span>#${o.id} · ${statusFa(o.status)}</div></div>`).join(''):'<div class="empty">هنوز سفارشی ثبت نکرده‌اید.</div>')+`<button class="btn dark" onclick="setTab('buy')">${icon('bag','icon sm')} ثبت خرید جدید</button>`)}
function statusFa(s){return ({pending_payment:'در انتظار پرداخت',payment_review:'در انتظار بررسی رسید',approved:'تایید شده',in_progress:'در حال انجام',completed:'تکمیل شده',cancelled:'لغو شده'})[s]||s}
async function renderServices(){document.querySelector('#app').innerHTML=shell(hero('WE CAN FAMILY','سرویس‌های ما','تمام دسته‌بندی‌های فعال را اینجا ببینید.','grid')+state.cats.map(c=>`<button class="card category" onclick="openCategoryFromServices(${c.id})"><div class="category-icon">${icon('grid','icon')}</div><div class="category-body"><b>${esc(c.name)}</b><span>مشاهده سرویس‌های این دسته</span></div><div class="chevron">‹</div></button>`).join('')||'<div class="empty">هنوز دسته‌بندی فعالی وجود ندارد.</div>')}
async function openCategoryFromServices(id){state.tab='buy';await pickCat(id)}
function renderSupport(){document.querySelector('#app').innerHTML=shell(hero('مرکز پشتیبانی','پشتیبانی','اگر سوال یا مشکلی دارید، پیام خود را برای ما ارسال کنید.','support')+`<div class="success"><b style="font-size:12px">پشتیبانی سریع</b><div class="muted" style="font-size:10px;line-height:1.9;margin-top:5px">موضوع و پیام را بنویسید؛ درخواست شما مستقیماً برای مدیریت ارسال می‌شود.</div></div><div class="card" style="margin-top:11px"><label style="font-size:11px;color:#b8c0c0">موضوع<input id="sub" class="field" placeholder="مثلاً مشکل سفارش"></label><label style="display:block;margin-top:13px;font-size:11px;color:#b8c0c0">پیام<textarea id="msg" class="field textarea" placeholder="پیام خود را بنویسید..."></textarea></label><button class="btn" onclick="ticket()">${icon('ticket','icon sm')} ارسال تیکت</button></div>`)}
async function ticket(){const subject=$('#sub').value.trim(),message=$('#msg').value.trim();if(!message)return toast('پیام را وارد کنید',false);try{await api('/api/tickets',{method:'POST',body:{subject,message}});toast('تیکت با موفقیت ثبت شد');$('#msg').value=''}catch(e){toast(e.message,false)}}
init();
</script>
</body>
</html>
